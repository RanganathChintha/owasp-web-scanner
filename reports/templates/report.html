<!DOCTYPE html>
<html>
<head>
    <title>OWASP Web Scanner Report</title>
    <style>
        body { font-family: Arial; background:#111; color:#eee }
        h1 { color:#ff4c4c }
        .finding { border:1px solid #444; padding:15px; margin:10px 0 }
        .critical { color:red }
        .high { color:orange }
        .medium { color:yellow }
    </style>
</head>
<body>
<h1>OWASP Web Vulnerability Scan Report</h1>

{% for f in findings %}
<div class="finding">
    <h2 class="{{ f.severity }}">{{ f.vulnerability }}</h2>
    <p><b>Endpoint:</b> {{ f.url }}</p>
    <p><b>Payload:</b> {{ f.payload }}</p>
    <p><b>Impact:</b> {{ f.impact }}</p>
    <p><b>CVSS Score:</b> {{ f.cvss }}</p>
    <p><b>Remediation:</b> {{ f.fix }}</p>
</div>
{% endfor %}

</body>
</html>
